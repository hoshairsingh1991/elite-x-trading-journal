<svg width="1200" height="1200" viewBox="0 0 1200 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E90FF"/>
      <stop offset="100%" stop-color="#0047FF"/>
    </linearGradient>

    <linearGradient id="whiteGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D9E1FF"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1200" fill="#020817"/>

  <!-- EX Symbol -->
  <g transform="translate(180 220)">
    <!-- E Bars -->
    <polygon points="0,0 250,0 220,40 30,40" fill="url(#blueGradient)"/>
    <polygon points="0,110 210,110 180,150 30,150" fill="url(#blueGradient)"/>
    <polygon points="0,220 250,220 220,260 30,260" fill="url(#blueGradient)"/>

    <!-- White Arrow -->
    <polygon points="320,0 420,0 280,260 180,260" fill="url(#whiteGradient)"/>

    <!-- Blue X Leg -->
    <polygon points="430,0 530,0 380,260 280,260" fill="url(#blueGradient)"/>

    <!-- Growth Arrow -->
    <path d="M430 120 L620 0" stroke="#1E90FF" stroke-width="28" stroke-linecap="round"/>
    <polygon points="620,0 590,10 605,40" fill="#1E90FF"/>

    <!-- Candlesticks -->
    <g filter="url(#glow)">
      <line x1="520" y1="210" x2="520" y2="130" stroke="#60A5FA" stroke-width="5"/>
      <rect x="505" y="150" width="30" height="45" fill="#1E90FF"/>

      <line x1="575" y1="180" x2="575" y2="90" stroke="#93C5FD" stroke-width="5"/>
      <rect x="560" y="110" width="30" height="55" fill="#2563EB"/>

      <line x1="630" y1="150" x2="630" y2="40" stroke="#BFDBFE" stroke-width="5"/>
      <rect x="615" y="70" width="30" height="60" fill="#60A5FA"/>

      <line x1="685" y1="120" x2="685" y2="0" stroke="#FFFFFF" stroke-width="5"/>
      <rect x="670" y="20" width="30" height="70" fill="#E0F2FE"/>
    </g>
  </g>

  <!-- Brand Text -->
  <text x="180" y="700"
        font-family="Arial, Helvetica, sans-serif"
        font-size="110"
        letter-spacing="20"
        font-weight="700"
        fill="white">
    ELITE
  </text>

  <text x="850" y="700"
        font-family="Arial, Helvetica, sans-serif"
        font-size="110"
        font-weight="700"
        fill="url(#blueGradient)">
    X
  </text>

  <!-- Trading OS -->
  <line x1="180" y1="790" x2="300" y2="790" stroke="#1E90FF" stroke-width="4"/>
  <line x1="900" y1="790" x2="1020" y2="790" stroke="#1E90FF" stroke-width="4"/>

  <text x="360" y="810"
        font-family="Arial, Helvetica, sans-serif"
        font-size="52"
        letter-spacing="12"
        fill="#1E90FF">
    TRADING OS
  </text>

  <!-- Tagline -->
  <text x="180" y="920"
        font-family="Arial, Helvetica, sans-serif"
        font-size="42"
        letter-spacing="6"
        fill="#FFFFFF">
    TRADE. REVIEW. IMPROVE. REPEAT.
  </text>
</svg>
